/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'application'
}

dependencies {
    implementation 'org.apache.kafka:kafka-clients:3.6.1'
    implementation project(':protobuf')
    implementation 'org.yaml:snakeyaml:2.1'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    runtimeOnly 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.2'
    implementation 'commons-io:commons-io:2.20.0'
    implementation 'org.apache.commons:commons-lang3:3.19.0'
    implementation 'io.micrometer:micrometer-core:1.15.5'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.15.5'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'com.google.protobuf:protobuf-java:4.33.1'

}
repositories {
    mavenCentral()
}

application {
    // Define the main class for the application.
    mainClass = 'org.shahin.Main'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'org.shahin.Main'
        )
    }
}

test {
    useJUnitPlatform()
}


