/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'application'
    id 'buildlogic.java-conventions'
}

dependencies {
    implementation libs.org.apache.kafka.kafka.clients
    implementation project(':protobuf')
    implementation libs.org.yaml.snakeyaml
    implementation libs.org.slf4j.slf4j.api
    implementation libs.ch.qos.logback.logback.classic
    implementation libs.net.logstash.logback.logstash.logback.encoder
    runtimeOnly libs.com.fasterxml.jackson.dataformat.jackson.dataformat.yaml
}
application {
    // Define the main class for the application.
    mainClass = 'org.shahin.Main'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'org.shahin.Main'
        )
    }
}


description = 'ingest'
