/*
 * This file was generated by the Gradle 'init' task.
 */


plugins {
    id 'application'
    id 'buildlogic.java-conventions'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
group = 'org.shahin'
version = '1.0-SNAPSHOT'

dependencies {
    implementation libs.com.google.protobuf.protobuf.java.x1
    implementation libs.org.apache.hadoop.hadoop.hdfs.client
    implementation libs.org.apache.hadoop.hadoop.mapreduce.client.core
    implementation libs.org.apache.hadoop.hadoop.mapreduce.client.common
    implementation libs.org.apache.avro.avro
    implementation libs.org.apache.parquet.parquet.avro
    implementation libs.org.apache.hadoop.hadoop.common
    implementation libs.org.apache.hadoop.hadoop.hdfs
    implementation libs.org.apache.avro.avro.protobuf
    implementation libs.org.slf4j.slf4j.api
    implementation libs.ch.qos.logback.logback.classic
    implementation libs.net.logstash.logback.logstash.logback.encoder
    implementation 'org.yaml:snakeyaml:2.5'
    implementation libs.org.apache.kafka.kafka.clients
    implementation project(':protobuf')
    runtimeOnly libs.com.fasterxml.jackson.dataformat.jackson.dataformat.yaml
    testImplementation libs.junit.junit
}

application {
    mainClass = 'org.shahin.App'
}


shadowJar {
    archiveBaseName.set('parquet-writer')
    archiveVersion.set('')
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'org.shahin.App'
    }
}
description = 'parquet-writer'
