/*
 * This file was generated by the Gradle 'init' task.
 */


plugins {
    id 'application'
    id 'buildlogic.java-conventions'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
group = 'org.shahin'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}


dependencies {

    implementation 'org.apache.hadoop:hadoop-hdfs-client:3.3.6'
    implementation 'org.apache.hadoop:hadoop-mapreduce-client-core:3.3.6'
    implementation 'org.apache.hadoop:hadoop-mapreduce-client-common:3.3.6'
    implementation 'org.apache.hadoop:hadoop-common:3.3.6'
    implementation 'org.apache.hadoop:hadoop-hdfs:3.3.6'

    implementation 'org.apache.avro:avro:1.11.2'
    implementation 'org.apache.parquet:parquet-avro:1.12.3'

    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    implementation 'org.yaml:snakeyaml:2.5'

    implementation 'org.apache.kafka:kafka-clients:3.6.1'

    implementation project(':protobuf')

    implementation project(':consumer-wrapper')

    testImplementation 'org.mockito:mockito-core:5.19.0'

    runtimeOnly 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.12.4'

    implementation "org.apache.avro:avro-protobuf:1.11.3"
    implementation "com.google.protobuf:protobuf-java:3.24.3"

    implementation 'io.prometheus:simpleclient_dropwizard:0.16.0'

    implementation 'io.prometheus:simpleclient_httpserver:0.16.0'
    testImplementation 'org.apache.hadoop:hadoop-minicluster:3.4.2'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'org.shahin.App'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName.set('parquet-writer')
    archiveVersion.set('')
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'org.shahin.App'
    }
}
description = 'parquet-writer'
