package protobuf;
option java_package = "org.shahin.protobuf";
option java_outer_classname = "NetRecordProto";

message NetRecord {
  required string date = 1;
  required int32 hour = 2;
  required int32 minute = 3;

  required string ipv4_src_addr = 4;
  required int32 l4_src_port = 5;

  required string ipv4_dst_addr = 6;
  required int32 l4_dst_port = 7;

  required int32 in_bytes = 8;
  required int32 out_bytes = 9;
}